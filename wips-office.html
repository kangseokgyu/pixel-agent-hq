}
#wips-office-root h1,
#wips-office-root h2,
#wips-office-root h3,

}
#wips-office-root .office-header {
  align-items: flex-start;
  margin-block-end: calc(var(--font-size-base) * 0.8);
}
#wips-office-root .title-stack {
  display: grid;
  gap: calc(var(--font-size-base) * 0.35);
  min-width: 0;
}
#wips-office-root .snapshot-meta,
#wips-office-root .section-note,
#wips-office-root .count-line,
#wips-office-root .task-facts dt {
  color: var(--muted-foreground);
}
#wips-office-root .snapshot-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: calc(var(--font-size-base) * 0.5);
}
#wips-office-root .snapshot-meta a,
#wips-office-root .task-source {
  color: var(--primary);
}
#wips-office-root .sync-controls {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: calc(var(--font-size-base) * 0.6);
  margin-block-start: calc(var(--font-size-base) * 0.5);
}
#wips-office-root .sync-status {
  color: var(--muted-foreground);
  margin: 0;
}
#wips-office-root .sync-status[data-state="error"] { color: var(--destructive); }
#wips-office-root .sync-button {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.35em 0.8em;
  color: var(--foreground);
  background: var(--secondary);
  font: inherit;
  cursor: pointer;
}
#wips-office-root .sync-button:disabled { cursor: wait; opacity: 0.65; }
#wips-office-root .employee-button {
  appearance: none; display: block; position: relative;
  margin: 0; padding: 4px 8px; width: auto; height: auto;
  border: 1px solid transparent; border-radius: 14px;
  background: transparent; color: var(--foreground);
  font: inherit; cursor: pointer; box-shadow: none;
}
#wips-office-root .employee-button:hover {
  background: color-mix(in srgb, var(--foreground) 4%, transparent);
}
#wips-office-root .employee-button[aria-pressed="true"] {
  border-color: color-mix(in srgb, var(--blue) 45%, transparent);
  background: color-mix(in srgb, var(--blue) 6%, transparent);
}
#wips-office-root .employee-button:focus-visible {
  outline: 2px solid var(--blue); outline-offset: 4px;
}
#wips-office-root .employee-button[draggable="true"] { cursor: grab; }
#wips-office-root .employee-button[draggable="true"]:active { cursor: grabbing; }
#wips-office-root .employee-button.is-dragging { opacity: 0.45; }
#wips-office-root .employee-button[aria-pressed="true"] .employee-name {
  color: var(--office-ink);
  background: #e2edf3;
  border-color: #91b1c3;
}
#wips-office-root .employee-button[aria-pressed="true"] .employee-name::before {
  content: "✓"; margin-inline-end: 5px; color: #416c83;
}
#wips-office-root .person-art { --shirt: #647f72; }
#wips-office-root .viz-controls {
  margin-block: calc(var(--font-size-base) * 0.9);
}
#wips-office-root .filter-field {
  display: grid;
  gap: calc(var(--font-size-base) * 0.25);
  min-width: min(100%, 180px);
}
#wips-office-root .status-counts {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--font-size-base) * 0.35) calc(var(--font-size-base) * 0.85);
  margin-block: calc(var(--font-size-base) * 0.45) calc(var(--font-size-base) * 0.9);
}
#wips-office-root .status-count {
  display: inline-flex;
  align-items: center;
  gap: calc(var(--font-size-base) * 0.28);
  white-space: normal;
}
#wips-office-root .status-dot {
  display: inline-block;
  flex: none;
  width: 0.62em;
  height: 0.62em;
  border-radius: 50%;
  background: var(--muted-foreground);
}
#wips-office-root .status-dot[data-status="진행"] { background: #2383e2; }
#wips-office-root .status-dot[data-status="검증"] { background: #9d68d3; }
#wips-office-root .status-dot[data-status="장시간 테스트 중"] { background: #dfab01; }
#wips-office-root .status-dot[data-status="대기"] { background: #d9730d; }
#wips-office-root .status-dot[data-status="예정"] { background: #91918e; }
#wips-office-root .status-dot[data-status="완료"] { background: #448361; }
#wips-office-root .office-room {
  position: relative;
  min-width: 0;
  padding: 26px 16px 22px;
  border: 8px solid var(--office-wall);
  border-bottom-width: 12px;
  background-color: var(--office-floor);
  background-image:
    linear-gradient(rgba(99, 77, 55, 0.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(99, 77, 55, 0.09) 1px, transparent 1px);
  background-size: 32px 32px;
}
#wips-office-root .room-dressing { position: absolute; inset: 0; pointer-events: none; }
#wips-office-root .window-frame {
  position: absolute; top: -8px; left: 12%; width: 25%; height: 8px;
  background: #a8c8d8;
  border-inline: 3px solid #74848c;
}
#wips-office-root .window-frame::after {
  content: ""; position: absolute; top: 0; left: 50%; width: 3px; height: 8px;
  background: #74848c;
}
#wips-office-root .wall-clock {
  position: absolute; top: -8px; right: 12%; width: 25%; height: 8px;
  background: #a8c8d8;
  border-inline: 3px solid #74848c;
}
#wips-office-root .seating-toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-block: 12px;
}
#wips-office-root .seating-toolbar [hidden] { display: none; }
#wips-office-root .seating-toolbar p { color: var(--muted-foreground); }
#wips-office-root .seat-control { display: grid; gap: 4px; width: 100%; min-width: 0; color: var(--office-ink); }
#wips-office-root .seat-control select { width: 100%; min-width: 0; }
#wips-office-root .office-grid {
  position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 38px 22px; align-items: end; min-width: 0;
}
#wips-office-root .workstation {
  display: grid; align-content: end; justify-items: center;
  gap: 12px; min-width: 0;
}
#wips-office-root .workstation.is-drop-target {
  outline: 2px dashed var(--blue); outline-offset: 6px;
  border-radius: 8px;
  background: color-mix(in srgb, var(--blue) 8%, transparent);
}
#wips-office-root .speech-bubble {
  position: relative; display: grid; gap: 3px; align-content: start;
  width: 100%; min-width: 0; padding: 8px;
  border: 1px solid #d6cfc3; border-radius: 8px;
  background: var(--office-bubble); color: var(--office-ink); overflow-wrap: anywhere;
}
#wips-office-root .speech-bubble::after {
  content: ""; position: absolute; left: calc(50% - 5px); bottom: -6px;
  width: 10px; height: 10px; transform: rotate(45deg);
  background: var(--office-bubble); border-right: 1px solid #d6cfc3; border-bottom: 1px solid #d6cfc3;
}
#wips-office-root .speech-status { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
#wips-office-root .speech-title { font-weight: 500; overflow-wrap: anywhere; }
#wips-office-root .speech-other { color: var(--office-muted); }
#wips-office-root .person-art { position: relative; display: block; width: 150px; height: 154px; --motion-delay: 0s; }

#wips-office-root .person-art[data-employee="석규"] { --shirt: #be7956; }
#wips-office-root .person-art[data-employee="UI"] { --shirt: #587d88; }

#wips-office-root .person-art[data-motion-phase="1"] { --motion-delay: -0.12s; }
#wips-office-root .person-art[data-motion-phase="2"] { --motion-delay: -0.24s; }
#wips-office-root .person-art[data-motion-phase="3"] { --motion-delay: -0.36s; }
#wips-office-root .person-art[data-motion-phase="4"] { --motion-delay: -0.48s; }
@keyframes office-focus-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-1.5px); }
}
@keyframes office-type-left {
  0%, 100% { transform: rotate(-18deg); }
  50% { transform: rotate(-10deg); }
}
@keyframes office-type-right {
  0%, 100% { transform: rotate(18deg); }
  50% { transform: rotate(10deg); }
}
#wips-office-root .workstation[data-activity="working"] .person-head,
#wips-office-root .workstation[data-activity="working"] .person-hair {
  animation: office-focus-bob 1.7s ease-in-out infinite;
  animation-delay: var(--motion-delay);
}
#wips-office-root .workstation[data-activity="working"] .person-body::before {
  animation: office-type-left 0.52s ease-in-out infinite;
  animation-delay: var(--motion-delay);
  transform-origin: 50% 0;
}
#wips-office-root .workstation[data-activity="working"] .person-body::after {
  animation: office-type-right 0.52s ease-in-out infinite;
  animation-delay: calc(var(--motion-delay) - 0.18s);
  transform-origin: 50% 0;
}
@media (prefers-reduced-motion: reduce) {
  #wips-office-root .workstation[data-activity="working"] .person-head,

  #wips-office-root .workstation[data-activity="working"] .person-body::before,

<script id="office-model">
(() => {
  const STATUS_ORDER = ["진행", "검증", "장시간 테스트 중", "대기", "예정", "완료"];
  const STATUS_RANK = new Map(STATUS_ORDER.map((status, index) => [status, index]));
  const EMPLOYEES = ["sb", "이요원", "여이전트", "석규", "UI"];
  const ALL_STATUS = "전체 상태";
  const ALL_PROJECTS = "전체 프로젝트";
  const UNSPECIFIED_PROJECT = "프로젝트 미지정";

  function projectLabel(task) {
    return task.project === null || task.project === undefined ? UNSPECIFIED_PROJECT : task.project;
  }

  function matches(task, filters) {
    const statusMatches = filters.status === ALL_STATUS || task.status === filters.status;
    const projectMatches = filters.project === ALL_PROJECTS || projectLabel(task) === filters.project;
    return statusMatches && projectMatches;
  }

  function safeNotionUrl(value) {
    if (typeof value !== "string") return "";
    try {
      const parsed = new URL(value);
      const notionHosts = ["app.notion.com", "notion.so", "www.notion.so"];
      return parsed.protocol === "https:" && notionHosts.includes(parsed.hostname) ? parsed.href : "";
    } catch {
      return "";
    }
  }

  function formatGoalDate(task) {
    if (task.startDate && task.endDate) return task.startDate + " — " + task.endDate;
    if (task.startDate) return task.startDate + " · 종료일 미지정";
    if (task.endDate) return "시작일 미지정 · " + task.endDate;
    return "미지정";
  }

  function describeTask(task) {
    return {
      title: task.title,
      status: task.status,
      project: projectLabel(task),
      priority: task.priority ?? "미지정",
      goalDate: formatGoalDate(task),
      nextCheck: task.checkDate ?? "미지정",
      nextAction: task.nextAction ?? "미지정",
      doneCondition: task.doneCondition ?? "미지정",
      sourceUrl: safeNotionUrl(task.url),
    };
  }

  function createOfficeModel(snapshot) {
    const tasks = Array.isArray(snapshot.results) ? snapshot.results.slice() : [];
    const statuses = STATUS_ORDER.concat([...new Set(tasks.map((task) => task.status).filter(Boolean))]
      .filter((status) => !STATUS_ORDER.includes(status)));
    const employees = EMPLOYEES.concat([...new Set(tasks.map((task) => task.owner).filter(Boolean))]
      .filter((owner) => !EMPLOYEES.includes(owner)));
    const projects = ["2.3", "2.2.1", "기타"].concat([...new Set(tasks.map((task) => task.project).filter(Boolean))]
      .filter((project) => !["2.3", "2.2.1", "기타"].includes(project)));

    function parseStateCandidate(candidate) {
      if (typeof candidate === "string") {
        try { return JSON.parse(candidate); } catch { return null; }
      }
      return candidate && typeof candidate === "object" ? candidate : null;
    }

    function stateFromHost(candidate) {
      const outer = parseStateCandidate(candidate);
      if (!outer) return null;
      const nested = parseStateCandidate(outer.privateContent) || parseStateCandidate(outer.modelContent);
      const saved = nested || outer;
      const selectedEmployee = employees.includes(saved.selectedEmployee) ? saved.selectedEmployee : "sb";
      const status = [ALL_STATUS].concat(statuses).includes(saved.status) ? saved.status : ALL_STATUS;
      const projectOptions = [ALL_PROJECTS, ...projects, UNSPECIFIED_PROJECT];
      const project = projectOptions.includes(saved.project) ? saved.project : ALL_PROJECTS;
      return { selectedEmployee, status, project };
    }

    function restorePendingState(candidate, currentState, userChangedState) {
      if (userChangedState) return currentState;
      return stateFromHost(candidate) || currentState;
    }

    function filteredTasks(filters) {
      return tasks.filter((task) => matches(task, filters));
    }

    function summary(filters) {
      const shown = filteredTasks(filters);
      const statusCounts = Object.fromEntries(statuses.map((status) => [
        status,
        shown.filter((task) => task.status === status).length,
      ]));
      return {
        total: shown.length,
        snapshotTotal: tasks.length,
        unassigned: shown.filter((task) => task.owner === null || task.owner === undefined).length,
        statuses: statusCounts,
      };
    }

    function employeeTasks(owner, filters) {
      return filteredTasks(filters).filter((task) => task.owner === owner && task.status !== "완료");
    }

    function unassignedTasks(filters) {
      return filteredTasks(filters).filter((task) => (task.owner === null || task.owner === undefined) && task.status !== "완료");
    }

    function representativeTask(owner, filters) {
      const owned = employeeTasks(owner, filters).filter((task) => !task.parentTaskIds?.length);
      if (owned.length === 0) return null;
      return owned
        .map((task, index) => ({ task, index }))
        .sort((left, right) => {
          const leftRank = STATUS_RANK.get(left.task.status) ?? STATUS_ORDER.length;
          const rightRank = STATUS_RANK.get(right.task.status) ?? STATUS_ORDER.length;
          return leftRank - rightRank || left.index - right.index;
        })[0].task;
    }

    function viewForEmployee(owner, filters) {
      const owned = employeeTasks(owner, filters);
      const topLevelCount = owned.filter((task) => !task.parentTaskIds?.length).length;
      const representative = representativeTask(owner, filters);
      return {
        owner,
        tasks: owned,
        topLevelCount,
        representative,
        otherCount: representative ? topLevelCount - 1 : 0,
        empty: owned.length === 0,
      };
    }

    function normalizeSeating(saved) {
      const valid = Array.isArray(saved) ? saved.filter((owner) => employees.includes(owner)) : [];
      return [...new Set([...valid, ...employees])];
    }

    function swapSeats(saved, owner, target) {
      const order = normalizeSeating(saved);
      const from = order.indexOf(owner);
      const to = order.indexOf(target);
      if (from >= 0 && to >= 0) [order[from], order[to]] = [order[to], order[from]];
      return order;
    }

    function focusEmployeeButton(buttons, owner) {
      const button = buttons.find((candidate) => candidate.dataset.owner === owner);
      if (!button || typeof button.focus !== "function") return null;
      button.focus();
      return button;
    }

    return {
      employees,
      statuses,
      projects,
      stateFromHost,
      restorePendingState,
      filteredTasks,
      summary,
      employeeTasks,

  const TOKEN_INVALID_PATTERN = /[\s\u0000-\u001F\u007F]/;
  const CONTROL_PATTERN = /[\u0000-\u001F\u007F]/;
  const LOCAL_HTTP_HOSTS = new Set(["127.0.0.1", "localhost", "[::1]"]);

  function validateStaticConnection(input) {
    const rawToken = typeof input?.token === "string" ? input.token : "";
    if (!rawToken || TOKEN_INVALID_PATTERN.test(rawToken)) {
      return { ok: false, error: "Notion 토큰은 공백이나 제어 문자 없이 입력해야 합니다." };
    }
    const rawId = typeof input?.dataSourceId === "string" ? input.dataSourceId.trim() : "";
    if (!UUID_PATTERN.test(rawId)) {
      return { ok: false, error: "데이터 소스 ID는 표준 UUID(8-4-4-4-12) 형식이어야 합니다." };
    }
    const rawProxy = typeof input?.corsProxyUrl === "string" ? input.corsProxyUrl.trim() : "";
    if (!rawProxy || CONTROL_PATTERN.test(rawProxy)) {
      return { ok: false, error: "CORS 중계 URL을 올바르게 입력하세요." };
    }
    let normalizedProxy = "";
    try {
      const parsed = new URL(rawProxy);
      const isHttps = parsed.protocol === "https:";
      const isLocal = parsed.protocol === "http:" && LOCAL_HTTP_HOSTS.has(parsed.hostname);
      if (!isHttps && !isLocal) {
        return { ok: false, error: "CORS 중계 URL은 https:// (또는 로컬 테스트용 http://127.0.0.1)만 허용됩니다." };
      }
      if (parsed.username || parsed.password || parsed.search || parsed.hash) {
        return { ok: false, error: "CORS 중계 URL에 자격증명이나 쿼리스트링을 포함할 수 없습니다." };
      }
      normalizedProxy = parsed.href.replace(/\/$/, "");
    } catch {
      return { ok: false, error: "CORS 중계 URL 형식이 올바르지 않습니다." };
    }
    return {
      ok: true,
      value: {
        token: rawToken,
        dataSourceId: rawId.toLowerCase(),
        corsProxyUrl: normalizedProxy,
      },
    };
  }

  function createBrowserOpfsStore() {
    function isSupported() {
      return typeof navigator !== "undefined" && Boolean(navigator.storage) && typeof navigator.storage.getDirectory === "function";
    }
    async function getPrivateDir(create) {
      if (!isSupported()) throw new Error("OPFS를 지원하지 않는 브라우저입니다.");
      const rootDir = await navigator.storage.getDirectory();
      try {
        return await rootDir.getDirectoryHandle(OPFS_DIR_NAME, { create });
      } catch (error) {
        if (!create && error?.name === "NotFoundError") return null;
        throw error;
      }
    }
    async function writeVerified(fileName, payload) {
      const dir = await getPrivateDir(true);
      const serialized = JSON.stringify(payload);
      const handle = await dir.getFileHandle(fileName, { create: true });
      const writable = await handle.createWritable();
      await writable.write(serialized);
      await writable.close();
      const file = await handle.getFile();
      const readback = await file.text();
      if (JSON.stringify(JSON.parse(readback)) !== JSON.stringify(JSON.parse(serialized))) {
        throw new Error("OPFS 저장 검증에 실패했습니다.");
      }
      return payload;
    }
    async function readJson(fileName) {
      const dir = await getPrivateDir(false);
      if (!dir) return null;
      let handle;
      try {
        handle = await dir.getFileHandle(fileName, { create: false });
      } catch (error) {
        if (error?.name === "NotFoundError") return null;
        throw error;
      }
      const file = await handle.getFile();
      const text = await file.text();
      return text ? JSON.parse(text) : null;
    }
    return {
      isSupported,
      async saveConnection(config) {
        const check = validateStaticConnection(config);
        if (!check.ok) throw new Error(check.error);
        return writeVerified(OPFS_CONNECTION_FILE, check.value);
      },
      async loadConnection() {
        if (!isSupported()) return null;
        const stored = await readJson(OPFS_CONNECTION_FILE);
        if (!stored) return null;
        const check = validateStaticConnection(stored);
        return check.ok ? check.value : null;
      },
      async saveSnapshot(nextSnapshot) {
        if (!isSupported()) return nextSnapshot;
        return writeVerified(OPFS_SNAPSHOT_FILE, nextSnapshot);
      },
      async loadSnapshot() {
        if (!isSupported()) return null;
        const stored = await readJson(OPFS_SNAPSHOT_FILE);
        if (!stored || !Array.isArray(stored.results)) return null;
        return stored;
      },
      async clearAll() {
        if (!isSupported()) return;
        const dir = await getPrivateDir(false);
        if (!dir) return;
        for (const name of [OPFS_CONNECTION_FILE, OPFS_SNAPSHOT_FILE]) {
          try {
            await dir.removeEntry(name);
          } catch (error) {
            if (error?.name !== "NotFoundError") throw error;
          }
        }
      },
    };
  }

      year: "numeric",
      month: "2-digit",
      day: "2-digit",
    }).formatToParts(new Date()).filter((part) => part.type !== "literal").map(({ type, value }) => [type, value]));
    return values.year + "-" + values.month + "-" + values.day;
  }

  function staticParseRetryAfter(value) {
    if (value == null || value === "") return null;
    const seconds = Number(value);
    if (Number.isFinite(seconds) && seconds >= 0) return Math.ceil(seconds * 1000);
    const parsedDate = Date.parse(value);
    return Number.isFinite(parsedDate) ? Math.max(0, parsedDate - Date.now()) : null;
  }

  async function fetchNotionSnapshotStatic(connection, signal) {
    const valid = validateStaticConnection(connection);
    if (!valid.ok) throw new Error(valid.error);
    const { token, dataSourceId, corsProxyUrl } = valid.value;
    const endpoint = corsProxyUrl + "/data_sources/" + encodeURIComponent(dataSourceId) + "/query";
    const results = [];
    let cursor;
    let pageCount = 0;

    while (true) {
      if (pageCount >= STATIC_MAX_PAGES) {
        throw new Error("Notion 페이지네이션 안전 한도(" + STATIC_MAX_PAGES + ")를 초과했습니다.");
      }
      const body = { page_size: 100 };
      if (cursor) body.start_cursor = cursor;

      let retryCount = 0;
      let pagePayload = null;
      while (true) {
        if (signal?.aborted) {
          const abortErr = new Error("요청이 취소되었습니다.");
          abortErr.code = "NOTION_ABORTED";
          throw abortErr;
        }
        const controller = new AbortController();
        let timedOut = false;
        let cancelled = false;
        const onAbort = () => {
          cancelled = true;
          controller.abort();
        };
        signal?.addEventListener("abort", onAbort, { once: true });
        const timer = setTimeout(() => {
          timedOut = true;
          controller.abort();
        }, STATIC_REQUEST_TIMEOUT_MS);

        let response;
        try {
          response = await fetch(endpoint, {
            method: "POST",
            headers: {
              Authorization: "Bearer " + token,
              "Content-Type": "application/json",
              "Notion-Version": STATIC_NOTION_VERSION,
            },
            body: JSON.stringify(body),
            redirect: "error",
            credentials: "omit",
            cache: "no-store",
            signal: controller.signal,
          });
        } catch (error) {
          clearTimeout(timer);
          signal?.removeEventListener("abort", onAbort);
          if (cancelled || signal?.aborted) {
            const abortErr = new Error("요청이 취소되었습니다.");
            abortErr.code = "NOTION_ABORTED";
            throw abortErr;
          }
          if (timedOut || error?.name === "AbortError") {
            throw new Error("Notion 조회 요청 시간이 초과되었습니다.");
          }
          throw new Error("CORS 중계 서버 또는 네트워크에 연결할 수 없습니다.");
        }

        if (response.status === 429) {
          const retryDelay = staticParseRetryAfter(response.headers.get("retry-after")) ??
            Math.min(1000 * (2 ** retryCount), STATIC_MAX_RETRY_AFTER_MS);
          try { await response.body?.cancel(); } catch {}
          clearTimeout(timer);
          signal?.removeEventListener("abort", onAbort);
          if (retryDelay > STATIC_MAX_RETRY_AFTER_MS || retryCount >= STATIC_MAX_RETRIES) {
            throw new Error("Notion 요청 한도(429)에 도달했습니다. 잠시 후 다시 시도하세요.");
          }
          await new Promise((resolve) => setTimeout(resolve, retryDelay));
          retryCount += 1;
          continue;
        }

        if (!response.ok) {
          const upstreamStatus = response.status;
          try { await response.body?.cancel(); } catch {}
          clearTimeout(timer);
          signal?.removeEventListener("abort", onAbort);
          const err = upstreamStatus === 401 || upstreamStatus === 403
            ? new Error("인증 또는 권한 오류(HTTP " + upstreamStatus + "): Notion Integration의 Read content 권한과 단일 DB 연결, 토큰·데이터 소스 ID를 확인하세요.")
            : new Error("Notion 조회가 실패했습니다 (HTTP " + upstreamStatus + ").");
          err.upstreamStatus = upstreamStatus;
          throw err;
        }

        try {
          pagePayload = await response.json();
        } catch (error) {
          clearTimeout(timer);
          signal?.removeEventListener("abort", onAbort);
          if (cancelled || signal?.aborted) {
            const abortErr = new Error("요청이 취소되었습니다.");
            abortErr.code = "NOTION_ABORTED";
            throw abortErr;
          }
          if (timedOut || error?.name === "AbortError") {
            throw new Error("Notion 응답 본문 수신 시간이 초과되었습니다.");
          }
          throw new Error("Notion API가 유효한 JSON 응답을 반환하지 않았습니다.");
        }
        clearTimeout(timer);
        signal?.removeEventListener("abort", onAbort);
        break;
      }

      if (pagePayload?.request_status?.type === "incomplete") {
        throw new Error("Notion 조회 결과가 불완전(incomplete)하여 기존 데이터를 유지합니다.");
      }
      if (!Array.isArray(pagePayload?.results)) {
        throw new Error("Notion 응답에 results 목록이 없습니다.");
      }
      results.push(...pagePayload.results.map(staticMapNotionPage));
      pageCount += 1;
      if (!pagePayload.has_more) break;
      if (typeof pagePayload.next_cursor !== "string" || !pagePayload.next_cursor) {
        throw new Error("Notion 페이지네이션 응답에 next_cursor가 없습니다.");
      }
      cursor = pagePayload.next_cursor;
    }

    return {
      snapshotDate: staticTodayInKorea(),
      timezone: "Asia/Seoul",
      sourceUrl: "",
      results,
      has_more: false,
      data_source_ids: [dataSourceId],
      lastSuccessAt: new Date().toISOString(),
    };
  }

  function setConnectionMessage(message, stateName) {
    if (!connectionMessage) return;
    connectionMessage.textContent = message;
    connectionMessage.dataset.state = stateName || "idle";
  }

  function setOfflineBanner(message) {
    if (!offlineBanner) return;
    if (message) {
      offlineBanner.textContent = message;
      offlineBanner.hidden = false;
    } else {
      offlineBanner.textContent = "";
      offlineBanner.hidden = true;
    }
  }

  function applySnapshot(nextSnapshot) {
    let selectedStatus = statusSelect.value;
    let selectedProject = projectSelect.value;
    snapshot = nextSnapshot;
    model = createOfficeModel(snapshot);
    if (!hasLiveModel) {
      const restored = model.restorePendingState(pendingHostState, {
        selectedEmployee: state.selectedEmployee,
        status: selectedStatus,
        project: selectedProject,
      }, userChangedState);
      state.selectedEmployee = restored.selectedEmployee;
      selectedStatus = restored.status;
      selectedProject = restored.project;
      pendingHostState = null;
      hasLiveModel = true;
    }
    dataNode.textContent = JSON.stringify(snapshot);
    setSelectOptions(statusSelect, [ALL_STATUS, ...model.statuses], selectedStatus);
    setSelectOptions(projectSelect, [ALL_PROJECTS, ...model.projects, UNSPECIFIED_PROJECT], selectedProject);
    snapshotNode.textContent = snapshot.snapshotDate ? "Notion 반영 · " + snapshot.snapshotDate + " KST" : "Notion 실시간 조회";
    if (snapshot.sourceUrl) {
      sourceNode.hidden = false;
      setSafeHref(sourceNode, snapshot.sourceUrl);
    } else {
      sourceNode.hidden = true;
      sourceNode.removeAttribute("href");
    }
    if (mainView) mainView.hidden = false;
    render();
  }

  function clearViewDom() {
    snapshot = createEmptySnapshotObject();
    model = createOfficeModel(snapshot);
    hasLiveModel = false;
    dataNode.textContent = JSON.stringify(snapshot);
    employeeNode.replaceChildren();
    selectedTasksNode.replaceChildren();
    communalTasksNode.replaceChildren();
    countsNode.replaceChildren();
    summaryNode.textContent = "";
    selectedTitle.textContent = "";
    selectedNote.textContent = "";
    selectedEmpty.hidden = true;
    selectedEmpty.textContent = "";
    communalCount.textContent = "";
    communalEmpty.hidden = true;
    communalEmpty.textContent = "";
    snapshotNode.textContent = "연결되지 않음 (업무 데이터 없음)";
    sourceNode.hidden = true;
    sourceNode.removeAttribute("href");
    if (mainView) mainView.hidden = true;
    setOfflineBanner("");
  }

  function stopStaticPolling() {
    if (pollTimerId !== null) {
      window.clearInterval(pollTimerId);
      pollTimerId = null;
    }
  }

  function startStaticPolling() {
    if (pollTimerId !== null) return;
    pollTimerId = window.setInterval(refreshData, 30_000);
  }

  async function refreshData() {
    if (isRefreshing || (IS_STATIC_MODE && !activeConnection)) return;
    isRefreshing = true;
    refreshButton.disabled = true;
    const requestEpoch = sessionEpoch;
    setSyncStatus("Notion 데이터 확인 중…", "loading");
    let responseData = null;
    try {
      if (IS_STATIC_MODE) {
        activeFetchController?.abort();
        activeFetchController = new AbortController();
        const freshSnapshot = await fetchNotionSnapshotStatic(activeConnection, activeFetchController.signal);
        if (requestEpoch !== sessionEpoch) return;
        await opfsStore.saveSnapshot(freshSnapshot).catch(() => {});
        if (requestEpoch !== sessionEpoch) return;
        applySnapshot(freshSnapshot);
        setOfflineBanner("");
        setSyncStatus(formatSuccessTime(freshSnapshot.lastSuccessAt) + " · 30초 간격 자동 갱신", "success");
        return;
      }

      const response = await fetch("/api/tasks", {
        headers: { Accept: "application/json" },
        cache: "no-store",
      });
      responseData = await response.json().catch(() => null);
      if (!response.ok) {
        const error = new Error(responseData?.error || "Notion 데이터를 갱신하지 못했습니다.");
        error.responseData = responseData;
        throw error;
      }
      if (!responseData || !Array.isArray(responseData.results) || typeof responseData.snapshotDate !== "string") {
        throw new Error("서버가 유효한 Notion 스냅샷을 반환하지 않았습니다.");
      }

      applySnapshot(responseData);
      setSyncStatus(formatSuccessTime(snapshot.lastSuccessAt) + " · 30초 간격 자동 갱신", "success");
    } catch (error) {
      if (requestEpoch !== sessionEpoch || error?.code === "NOTION_ABORTED") return;
      const detail = error.responseData || responseData;
      const fallbackTime = IS_STATIC_MODE ? snapshot.lastSuccessAt : detail?.lastSuccessAt;
      const message = error.message || "서버에 연결할 수 없습니다. 연결 상태를 확인하세요.";
      if (IS_STATIC_MODE && navigator?.onLine === false && snapshot.results.length > 0) {
        setOfflineBanner("오프라인 상태입니다. 기기 OPFS에 저장된 마지막 조회 데이터를 표시합니다.");
      }
      setSyncStatus(message + (fallbackTime ? " · " + formatSuccessTime(fallbackTime) : ""), "error");
    } finally {
      isRefreshing = false;
      if (requestEpoch === sessionEpoch) {
        refreshButton.disabled = IS_STATIC_MODE && !activeConnection;
      }
    }
  }

  async function logoutSession() {
    sessionEpoch += 1;
    isRefreshing = false;
    activeFetchController?.abort();
    activeFetchController = null;
    stopStaticPolling();
    activeConnection = null;
    if (logoutButton) logoutButton.hidden = true;
    refreshButton.disabled = true;
    if (connectSubmitButton) connectSubmitButton.disabled = false;

    await opfsStore.clearAll().catch(() => {});
    if (typeof window.__wipsClearSwSession === "function") {
      await window.__wipsClearSwSession().catch(() => {});
    }
    try {
      if (typeof CustomEvent === "function") {
        window.dispatchEvent(new CustomEvent("wips:logout"));
      }
    } catch {}
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "wips:logout" }, window.location.origin);
      }
    } catch {}

    clearViewDom();
    if (tokenInput) tokenInput.value = "";
    if (dataSourceIdInput) dataSourceIdInput.value = "";
    if (proxyUrlInput) proxyUrlInput.value = "";
    if (connectionPanel) connectionPanel.hidden = false;
    if (connectCancelButton) connectCancelButton.hidden = true;
    const msg = "로그아웃되었습니다. 이 기기에서 토큰·연결 정보와 업무 데이터를 삭제했습니다.";
    setConnectionMessage(msg, "info");
    setSyncStatus(msg, "idle");
  }

  function saveState() {
    try {
      if (!window.openai || typeof window.openai.setWidgetState !== "function") return;
      const pending = window.openai.setWidgetState({
        modelContent: { selectedEmployee: state.selectedEmployee },
        privateContent: {
          selectedEmployee: state.selectedEmployee,
          status: statusSelect.value,
          project: projectSelect.value,
        },
      });
      if (pending && typeof pending.catch === "function") pending.catch(() => {});
    } catch {}
  }

  statusSelect.addEventListener("change", () => {
    userChangedState = true;
    state.status = statusSelect.value;
    render();
    saveState();
  });
  projectSelect.addEventListener("change", () => {
    userChangedState = true;
    state.project = projectSelect.value;
    render();
    saveState();
  });
  window.addEventListener?.("openai:set_globals", (event) => {
    const widgetState = event.detail && event.detail.globals && event.detail.globals.widgetState;
    if (!hasLiveModel) {
      pendingHostState = widgetState;
      if (userChangedState) return;
    }
    const incoming = model.stateFromHost(widgetState);
    if (!incoming) return;
    if (
      incoming.selectedEmployee === state.selectedEmployee &&
      incoming.status === statusSelect.value &&
      incoming.project === projectSelect.value
    ) return;
    state.selectedEmployee = incoming.selectedEmployee;
    statusSelect.value = incoming.status;
    projectSelect.value = incoming.project;
    render();
  });

  async function initStaticMode() {
    const startEpoch = sessionEpoch;
    clearViewDom();
    if (connectToggleButton) connectToggleButton.hidden = false;
    if (logoutButton) logoutButton.hidden = true;
    refreshButton.disabled = true;
    if (connectionPanel) connectionPanel.hidden = false;
    if (connectCancelButton) connectCancelButton.hidden = true;

    if (!opfsStore.isSupported()) {
      setConnectionMessage(
        "이 브라우저는 OPFS 격리 저장소를 지원하지 않습니다. 연결 정보는 현재 탭 세션 메모리에만 유지되며 새로고침 시 삭제됩니다.",
        "info",
      );
      setSyncStatus("Notion 연결 설정이 필요합니다 (OPFS 미지원 환경).", "idle");
      return;
    }

    let savedConnection = null;
    let savedSnapshot = null;
    try {
      savedConnection = await opfsStore.loadConnection();
      savedSnapshot = await opfsStore.loadSnapshot();
    } catch {
      savedConnection = null;
      savedSnapshot = null;
    }
    if (startEpoch !== sessionEpoch) return;

    if (!savedConnection) {
      await opfsStore.clearAll().catch(() => {});
      setSyncStatus("Notion 연결 설정이 필요합니다.", "idle");
      return;
    }

    activeConnection = savedConnection;
    if (dataSourceIdInput) dataSourceIdInput.value = savedConnection.dataSourceId;
    if (proxyUrlInput) proxyUrlInput.value = savedConnection.corsProxyUrl;
    if (logoutButton) logoutButton.hidden = false;
    refreshButton.disabled = false;
    if (connectionPanel) connectionPanel.hidden = true;

    if (savedSnapshot && !isEmptySnapshotData(savedSnapshot)) {
      applySnapshot(savedSnapshot);
      if (navigator?.onLine === false) {
        setOfflineBanner("오프라인 상태입니다. 기기 OPFS에 저장된 마지막 조회 데이터를 표시합니다.");
        setSyncStatus("오프라인 · " + formatSuccessTime(savedSnapshot.lastSuccessAt), "error");
        startStaticPolling();
        return;
      }
    }

    await refreshData();
    if (startEpoch === sessionEpoch && activeConnection) {
      startStaticPolling();
    }
  }

  refreshButton.addEventListener("click", refreshData);
  connectToggleButton?.addEventListener("click", () => {
    if (!connectionPanel) return;
    connectionPanel.hidden = !connectionPanel.hidden;
    if (connectCancelButton) connectCancelButton.hidden = !activeConnection;
    if (!connectionPanel.hidden && activeConnection) {
      if (dataSourceIdInput) dataSourceIdInput.value = activeConnection.dataSourceId;
      if (proxyUrlInput) proxyUrlInput.value = activeConnection.corsProxyUrl;
    }
  });
  connectCancelButton?.addEventListener("click", () => {
    if (connectionPanel && activeConnection) {
      connectionPanel.hidden = true;
    }
  });
  logoutButton?.addEventListener("click", () => {
    void logoutSession();
  });
  connectionForm?.addEventListener("submit", async (event) => {
    event.preventDefault();
    const validation = validateStaticConnection({
      token: tokenInput?.value || "",
      dataSourceId: dataSourceIdInput?.value || "",
      corsProxyUrl: proxyUrlInput?.value || "",
    });
    if (!validation.ok) {
      setConnectionMessage(validation.error, "error");
      return;
    }

    const submitEpoch = sessionEpoch;
    if (connectSubmitButton) connectSubmitButton.disabled = true;
    setConnectionMessage("Notion 연결 확인 및 데이터 조회 중…", "loading");
    setSyncStatus("Notion 연결 확인 중…", "loading");
    try {
      activeFetchController?.abort();
      activeFetchController = new AbortController();
      const freshSnapshot = await fetchNotionSnapshotStatic(validation.value, activeFetchController.signal);
      if (submitEpoch !== sessionEpoch) return;

      if (opfsStore.isSupported()) {
        await opfsStore.saveConnection(validation.value);
        await opfsStore.saveSnapshot(freshSnapshot);
      }
      if (submitEpoch !== sessionEpoch) return;

      activeConnection = validation.value;
      if (tokenInput) tokenInput.value = "";
      if (connectionPanel) connectionPanel.hidden = true;
      if (logoutButton) logoutButton.hidden = false;
      refreshButton.disabled = false;
      applySnapshot(freshSnapshot);
      setOfflineBanner("");
      setConnectionMessage("연결이 저장되었습니다. OPFS에 격리 보관됩니다.", "info");
      setSyncStatus(formatSuccessTime(freshSnapshot.lastSuccessAt) + " · 30초 간격 자동 갱신", "success");
      startStaticPolling();
    } catch (error) {
      if (submitEpoch !== sessionEpoch || error?.code === "NOTION_ABORTED") return;
      const msg = error?.message || "Notion 연결에 실패했습니다.";
      setConnectionMessage(msg, "error");
      setSyncStatus(msg, "error");
    } finally {
      if (connectSubmitButton && submitEpoch === sessionEpoch) {
        connectSubmitButton.disabled = false;
      }
    }
  });

  if (IS_STATIC_MODE) {
    window.addEventListener?.("offline", () => {
      if (activeConnection && snapshot.results.length > 0) {
        setOfflineBanner("오프라인 상태입니다. 기기 OPFS에 저장된 마지막 조회 데이터를 표시합니다.");
      }
    });
    window.addEventListener?.("online", () => {
      if (activeConnection) {
        setOfflineBanner("");
        void refreshData();
      }
    });
    void initStaticMode();
  } else {
    const snapshotLabel = "스냅샷 · " + snapshot.snapshotDate + " KST";
    snapshotNode.textContent = snapshotLabel;
    setSafeHref(sourceNode, snapshot.sourceUrl);
    render();
    setSyncStatus("서버 동기화 확인 중 · 마지막 성공: " + snapshot.snapshotDate + " 스냅샷", "loading");
    refreshData();
    window.setInterval(refreshData, 30_000);
  }
})();
</script>
